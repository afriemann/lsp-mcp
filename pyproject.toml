[project]
name = "lsp-mcp"
version = "0.1.0"
description = "MCP server exposing LSP-backed code navigation and editing tools with global extension-based server routing"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "multilspy>=0.0.15",
    "mcp>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
lsp-mcp = "lsp_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
